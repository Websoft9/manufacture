[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "websoft9-manufacture"
version = "0.1.0"
description = "Websoft9 marketplace business CLI"
requires-python = ">=3.10"
dependencies = ["click>=8.1"]

[project.scripts]
mk = "cli.cli:main"

[tool.setuptools.packages.find]
include = ["cli*"]
