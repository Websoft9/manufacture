name: Update Marketplace Product
description: Compare live content, revise or ask AI to optimize, review, then publish
title: "[Marketplace Offer Update] "
body:
  - type: markdown
    attributes:
      value: |
        ## How this task works

        Creating this issue starts a comparison between the live marketplace listing and the content assembled from this repository. The result is posted as a comment.

        Every follow-up action starts with a **new comment**. Ordinary discussion comments do not run the workflow. Commands are restricted to repository owners, members and collaborators.

        | Comment | Action |
        | --- | --- |
        | `/offer prepare` | Regenerate the comparison. **Discards edits made in this issue.** Also use this after a failed or mismatched ChangeSet, or if the issue predates the workflow. |
        | `/offer edit` + JSON block | Change the editable application copy. |
        | `/offer optimize <instructions>` | Ask Copilot to improve the editable copy. If instructions are omitted, the Update goal above is used. This is the only AI step and requires `COPILOT_CLI_TOKEN`. |
        | `/offer approve <full draft hash> [confirm]` | Approve the current draft. Add `confirm` when the draft contains issue edits, to confirm that no unverified factual claims were added. A new comparison requires a new approval. |
        | `/offer publish <full draft hash>` | Publish exactly the approved draft. This writes to the marketplace. |
        | `/offer status` | Check an in-progress ChangeSet and verify the metadata. |
        | `/offer complete` | Confirm the marketplace page, then close the task. |

        Only `summary`, `valueProposition`, `useCases`, and `searchKeywords` are editable. They feed the rendered title, short description, long description, highlights and keywords; editing those rendered fields directly is not supported. The template structure and the provider, support, trademark, deployment, billing, identity, edition, component and version fields are fixed.

        Scope: AWS AMI listing metadata only. Image versions, pricing, new products and other cloud platforms are not supported. Do not include credentials, private offers or sensitive data.
  - type: dropdown
    id: application
    attributes:
      label: Application
      options:
        - odoo
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Target platform
      options:
        - aws
    validations:
      required: true
  - type: textarea
    id: reason
    attributes:
      label: Update goal
      description: What should be corrected, or which wording should AI optimize?
    validations:
      required: true
