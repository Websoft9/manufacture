name: Marketplace Offer Update

on:
  issues:
    types: [opened]
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      issue_number:
        description: 更新任务的 Issue 编号
        required: true
        type: number
      command:
        description: 操作（审核、发布必须带完整草稿哈希）
        required: true
        default: /offer prepare
        type: string

permissions:
  contents: read
  issues: write
  actions: read
  id-token: write
  copilot-requests: write

# Serialize state transitions, including multiple issues targeting one AWS entity.
concurrency:
  group: marketplace-offer-update
  cancel-in-progress: false

jobs:
  update:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issues' && startsWith(github.event.issue.title, '[Update app]')) ||
      (github.event_name == 'issue_comment' && !github.event.issue.pull_request &&
       startsWith(github.event.comment.body, '/offer ') && github.event.sender.type != 'Bot')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install '.[aws]'
      - name: Validate task and operator
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          OFFER_ISSUE: ${{ inputs.issue_number }}
          OFFER_COMMAND: ${{ inputs.command }}
        run: python3 ci/offer_update.py gate
      - name: Configure AWS credentials
        if: steps.gate.outputs.cloud == 'true'
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: us-east-1
          role-session-name: OfferUpdate-${{ github.run_id }}
      - uses: actions/setup-node@v7
        if: steps.gate.outputs.optimize == 'true'
        with:
          node-version: 22
      - name: Install Copilot CLI
        if: steps.gate.outputs.optimize == 'true'
        run: npm install --global @github/copilot
      - name: Run requested operation
        env:
          GH_TOKEN: ${{ github.token }}
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_CLI_TOKEN || github.token }}
        run: python3 ci/offer_update.py execute
      - name: Save reviewed task state
        id: artifact
        uses: actions/upload-artifact@v4
        with:
          name: offer-update-state
          path: ${{ runner.temp }}/offer-update/state.json
          if-no-files-found: error
          retention-days: 30
      - name: Report task result
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 ci/offer_update.py report
      - name: Report workflow interruption
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 ci/offer_update.py failure
