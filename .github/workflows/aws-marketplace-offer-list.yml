name: AWS Marketplace Offer List

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: aws-marketplace-offer-list
  cancel-in-progress: false

jobs:
  list-offers:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check AWS role configuration
        env:
          AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
        run: |
          if [[ -z "$AWS_ROLE_ARN" ]]; then
            echo "::error::Configure the AWS_ROLE_ARN Actions variable and allow this repository to assume the role with GitHub OIDC."
            exit 1
          fi
          if [[ ! "$AWS_ROLE_ARN" =~ ^arn:aws:iam::[0-9]{12}:role/.+ ]]; then
            echo "::error::AWS_ROLE_ARN must be an IAM role ARN (arn:aws:iam::<12-digit-account-id>:role/<role-name>), not an OIDC provider ARN."
            exit 1
          fi

      - name: Configure AWS credentials with GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: us-east-1
          role-session-name: MarketplaceOfferList-${{ github.run_id }}

      - name: Verify AWS caller identity
        run: aws sts get-caller-identity --query '{Account:Account,Arn:Arn}' --output table

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install AWS SDK
        run: python -m pip install --disable-pip-version-check boto3

      - name: List seller AMI products
        run: |
          python - <<'PY'
          import json
          import os

          import boto3
          from botocore.config import Config

          client = boto3.client(
              "marketplace-catalog",
              region_name="us-east-1",
              config=Config(retries={"mode": "standard", "total_max_attempts": 5}),
          )

          def cell(value):
              return str(value or "").replace("|", "\\|").replace("\n", " ")

          def describe_product(entity_id):
              try:
                  response = client.describe_entity(
                      Catalog="AWSMarketplace",
                      EntityId=entity_id,
                  )
              except client.exceptions.AccessDeniedException:
                  raise SystemExit(
                      "DescribeEntity permission is required to list versions. "
                      "Allow aws-marketplace:DescribeEntity on AmiProduct/*."
                  )

              detail = response.get("DetailsDocument")
              if not detail:
                  detail = json.loads(response.get("Details") or "{}")

              versions = detail.get("Versions") or []
              public_versions = [
                  version
                  for version in versions
                  if any(
                      option.get("Visibility") == "Public"
                      for option in (version.get("DeliveryOptions") or [])
                  )
              ]
              candidates = public_versions or versions
              if not candidates:
                  return "", response.get("LastModifiedDate", "")

              latest = max(candidates, key=lambda version: version.get("CreationDate") or "")
              return (
                  latest.get("VersionTitle") or latest.get("Id") or "",
                  response.get("LastModifiedDate", ""),
              )

          token = None
          products = []

          while True:
              request = {
                  "Catalog": "AWSMarketplace",
                  "EntityType": "AmiProduct",
                  "MaxResults": 50,
              }
              if token:
                  request["NextToken"] = token
              response = client.list_entities(**request)

              for entity in response.get("EntitySummaryList", []):
                  summary = entity.get("AmiProductSummary") or {}
                  entity_id = entity.get("EntityId", "")
                  version, last_modified = describe_product(entity_id)
                  products.append({
                      "entityId": entity_id,
                      "title": summary.get("ProductTitle") or entity.get("Name", ""),
                      "visibility": summary.get("Visibility", ""),
                      "version": version,
                      "lastModified": last_modified,
                  })

              token = response.get("NextToken")
              if not token:
                  break

          products.sort(key=lambda product: (product["title"].casefold(), product["entityId"]))
          lines = [
              "## AWS Marketplace AMI products",
              "",
              f"Found **{len(products)}** product(s) in the seller account.",
              "",
              "| Catalog Entity ID | Product title | Visibility | Version | Last updated |",
              "| --- | --- | --- | --- | --- |",
          ]
          lines.extend(
              "| {entityId} | {title} | {visibility} | {version} | {lastModified} |".format(
                  entityId=cell(product["entityId"]),
                  title=cell(product["title"]),
                  visibility=cell(product["visibility"]),
                  version=cell(product["version"] or "-"),
                  lastModified=cell(product["lastModified"] or "-"),
              )
              for product in products
          )
          lines.extend([
              "",
              "> Version is the latest public version (or latest version if none is public); Last updated is the product entity's `LastModifiedDate`.",
          ])
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary_file:
              summary_file.write("\n".join(lines) + "\n")
          print(f"Listed {len(products)} AWS Marketplace AMI product(s). See the workflow summary.")
          PY
