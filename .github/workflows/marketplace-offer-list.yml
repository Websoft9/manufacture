name: Marketplace Offer List

on:
  workflow_dispatch:
    inputs:
      platform:
        description: "Cloud platform to list (all = aws + aliyun + alibabacloud)"
        type: choice
        required: true
        default: all
        options:
          - all
          - aws
          - alibabacloud
          - aliyun
          - azure
          - azure-vmlab
          - huaweicloud
          - huaweiyun
          - googlecloud

permissions:
  contents: read
  id-token: write
  issues: write

concurrency:
  group: marketplace-offer-list-${{ inputs.platform }}
  cancel-in-progress: false

jobs:
  list-offers:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Check AWS role configuration
        if: inputs.platform == 'aws' || inputs.platform == 'all'
        env:
          AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
        run: |
          if [[ -z "$AWS_ROLE_ARN" ]]; then
            echo "::error::Configure the AWS_ROLE_ARN Actions variable and allow this repository to assume the role with GitHub OIDC."
            exit 1
          fi
          if [[ ! "$AWS_ROLE_ARN" =~ ^arn:aws:iam::[0-9]{12}:role/.+ ]]; then
            echo "::error::AWS_ROLE_ARN must be an IAM role ARN (arn:aws:iam::<12-digit-account-id>:role/<role-name>), not an OIDC provider ARN."
            exit 1
          fi

      - name: Configure AWS credentials with GitHub OIDC
        if: inputs.platform == 'aws' || inputs.platform == 'all'
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: us-east-1
          role-session-name: MarketplaceOfferList-${{ github.run_id }}

      - name: Check Aliyun role configuration
        if: inputs.platform == 'aliyun' || inputs.platform == 'all'
        env:
          ALIYUN_ROLE_ARN: ${{ vars.ALIYUN_ROLE_ARN }}
          ALIYUN_OIDC_PROVIDER_ARN: ${{ vars.ALIYUN_OIDC_PROVIDER_ARN }}
        run: |
          if [[ -z "$ALIYUN_ROLE_ARN" || -z "$ALIYUN_OIDC_PROVIDER_ARN" ]]; then
            echo "::error::Configure ALIYUN_ROLE_ARN and ALIYUN_OIDC_PROVIDER_ARN as GitHub Actions variables."
            exit 1
          fi
          if [[ ! "$ALIYUN_ROLE_ARN" =~ ^acs:ram::([0-9]{12,20}):role/[^/]+$ ]]; then
            echo "::error::ALIYUN_ROLE_ARN must be a RAM role ARN (acs:ram::<account-id>:role/<role-name>)."
            exit 1
          fi
          role_account_id="${BASH_REMATCH[1]}"
          if [[ ! "$ALIYUN_OIDC_PROVIDER_ARN" =~ ^acs:ram::([0-9]{12,20}):oidc-provider/[^/]+$ ]]; then
            echo "::error::ALIYUN_OIDC_PROVIDER_ARN must be an OIDC provider ARN (acs:ram::<account-id>:oidc-provider/<provider-name>)."
            exit 1
          fi
          provider_account_id="${BASH_REMATCH[1]}"
          if [[ "$role_account_id" != "$provider_account_id" ]]; then
            echo "::error::The Aliyun RAM role and OIDC provider ARNs must belong to the same account."
            exit 1
          fi

      - name: Configure Aliyun credentials with GitHub OIDC
        if: inputs.platform == 'aliyun' || inputs.platform == 'all'
        uses: aliyun/configure-aliyun-credentials-action@1e5248c8d5d93a8781ac344a68e19a43341e79e6 # v1.1.0
        with:
          role-to-assume: ${{ vars.ALIYUN_ROLE_ARN }}
          oidc-provider-arn: ${{ vars.ALIYUN_OIDC_PROVIDER_ARN }}
          role-session-name: MarketplaceOfferList-${{ github.run_id }}
          audience: sts.aliyuncs.com

      - name: Verify AWS caller identity
        if: inputs.platform == 'aws' || inputs.platform == 'all'
        run: aws sts get-caller-identity --query '{Account:Account,Arn:Arn}' --output table

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install AWS SDK
        if: inputs.platform == 'aws' || inputs.platform == 'all'
        run: python -m pip install --disable-pip-version-check boto3

      - name: Install Aliyun SDK
        if: inputs.platform == 'aliyun' || inputs.platform == 'all'
        run: python -m pip install --disable-pip-version-check aliyun-python-sdk-core aliyun-python-sdk-market

      - name: List marketplace offers and create issues
        env:
          PLATFORM: ${{ inputs.platform }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          NOTIFICATION_FILE: /tmp/marketplace-offer-list-wecom.md
        run: |
          set -euo pipefail
          args=(--provider "$PLATFORM" --create-issue --notification-file "$NOTIFICATION_FILE")
          case "$PLATFORM" in
            aws) args+=(--region us-east-1) ;;
            aliyun) args+=(--region cn-hangzhou) ;;
          esac
          python3 ci/scripts/list_marketplace_offers.py "${args[@]}" >> "$GITHUB_STEP_SUMMARY"

      - name: Notify WeCom about offer list results
        if: always()
        continue-on-error: true
        env:
          WECOM_WEBHOOK: ${{ secrets.WECOM_WEBHOOK }}
          NOTIFICATION_FILE: /tmp/marketplace-offer-list-wecom.md
        run: |
          if [[ -f "$NOTIFICATION_FILE" ]]; then
            python3 ci/scripts/wecom_notify.py --markdown-file "$NOTIFICATION_FILE"
          else
            echo "::warning::Offer list notification file was not created"
          fi
