# Manual Marketplace ChangeSet apply workflow.
# Configure required reviewers on the aws-marketplace-production environment
# before using this workflow. The apply job waits for that approval.
name: Marketplace Offer Apply
run-name: "Apply ${{ inputs.app_name || inputs.app }} to ${{ inputs.cloud }}"

on:
  workflow_dispatch:
    inputs:
      app:
        description: "Application id from the catalog, for example odoo"
        required: true
        type: string
      app_name:
        description: "Optional application display name for the run, for example Odoo"
        required: false
        type: string
      cloud:
        description: "Target cloud platform (currently only aws is implemented)"
        required: true
        default: aws
        type: choice
        options:
          - aws
      offer_code:
        description: "Optional AWS offer code/SKU. Default: resolve from the configured offer source."
        required: false
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: marketplace-offer-apply-${{ inputs.cloud }}-${{ inputs.app }}
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      APP: ${{ inputs.app }}
      APP_NAME: ${{ inputs.app_name || inputs.app }}
      CLOUD: ${{ inputs.cloud }}
      OFFER_CODE: ${{ inputs.offer_code }}
      CONTENTFUL_SPACE_ID: ${{ vars.CONTENTFUL_SPACE_ID || secrets.CONTENTFUL_SPACE_ID }}
      CONTENTFUL_ENVIRONMENT: ${{ vars.CONTENTFUL_ENVIRONMENT || 'master' }}
    steps:
      - name: Validate inputs
        run: |
          if [[ ! "$APP" =~ ^[a-z0-9][a-z0-9-]*$ ]]; then
            echo "::error::app must be a lowercase application id, for example odoo"
            exit 1
          fi
          if [[ "$CLOUD" != "aws" ]]; then
            echo "::error::Only cloud=aws is implemented by the current apply workflow."
            exit 1
          fi

      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install CLI
        run: python -m pip install --disable-pip-version-check '.[aws]'

      - name: Diagnose Contentful configuration
        env:
          SPACE_VAR: ${{ vars.CONTENTFUL_SPACE_ID != '' }}
          SPACE_SECRET: ${{ secrets.CONTENTFUL_SPACE_ID != '' }}
          TOKEN_SECRET: ${{ secrets.CONTENTFUL_TOKEN != '' }}
          TOKEN_VAR: ${{ vars.CONTENTFUL_TOKEN != '' }}
        run: |
          echo "Repository: $GITHUB_REPOSITORY"
          echo "Repository owner: $GITHUB_REPOSITORY_OWNER"
          echo "CONTENTFUL_SPACE_ID variable: $SPACE_VAR"
          echo "CONTENTFUL_SPACE_ID secret: $SPACE_SECRET"
          echo "CONTENTFUL_TOKEN secret: $TOKEN_SECRET"
          echo "CONTENTFUL_TOKEN variable: $TOKEN_VAR"

      - name: Pull Contentful application data
        env:
          CONTENTFUL_TOKEN: ${{ secrets.CONTENTFUL_TOKEN }}
        run: |
          if [[ -z "$CONTENTFUL_SPACE_ID" ]]; then
            echo "::error::CONTENTFUL_SPACE_ID is empty. If it is an organization variable/secret, grant this repository access under Organization settings > Secrets and variables > Actions."
            exit 1
          fi
          if [[ -z "$CONTENTFUL_TOKEN" ]]; then
            echo "::error::CONTENTFUL_TOKEN is empty. If it is an organization secret, grant this repository access under Organization settings > Secrets and variables > Actions > Secrets."
            exit 1
          fi
          mkdir -p /tmp/opencode/offer-run
          mk catalog pull \
            --apps "$APP" \
            --output /tmp/opencode/offer-run/catalog.json \
            --environment "$CONTENTFUL_ENVIRONMENT"

      - name: Snapshot application versions
        run: |
          versions_url="$(python3 -c 'import json; print(json.load(open("config/app.json"))["sources"]["versions"])')"
          curl -fsSL "$versions_url" -o /tmp/opencode/offer-run/apps-verson.json

      - name: Build preview
        run: |
          mk offer build \
            --app "$APP" \
            --cloud "$CLOUD" \
            --catalog /tmp/opencode/offer-run/catalog.json \
            --versions /tmp/opencode/offer-run/apps-verson.json \
            --output "data/.catalog/$CLOUD/$APP.json"
          cp "data/.catalog/$CLOUD/$APP.json" /tmp/opencode/offer-run/preview.json

      - name: Check AWS plan role
        env:
          AWS_PLAN_ROLE_ARN: ${{ vars.AWS_PLAN_ROLE_ARN || vars.AWS_ROLE_ARN }}
        run: |
          if [[ -z "$AWS_PLAN_ROLE_ARN" ]]; then
            echo "::error::Configure AWS_PLAN_ROLE_ARN, or AWS_ROLE_ARN, as a repository variable."
            exit 1
          fi
          if [[ ! "$AWS_PLAN_ROLE_ARN" =~ ^arn:aws:iam::[0-9]{12}:role/.+$ ]]; then
            echo "::error::AWS_PLAN_ROLE_ARN must be an IAM role ARN."
            exit 1
          fi

      - name: Configure read-only AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_PLAN_ROLE_ARN || vars.AWS_ROLE_ARN }}
          aws-region: us-east-1
          role-session-name: MarketplaceOfferPlan-${{ github.run_id }}

      - name: Resolve Catalog EntityId
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          app = os.environ["APP"]
          cloud = os.environ["CLOUD"]
          code = (os.environ.get("OFFER_CODE") or "").strip()
          catalog_path = Path("/tmp/opencode/offer-run/catalog.json")
          catalog = json.loads(catalog_path.read_text(encoding="utf-8"))
          item = next((entry for entry in catalog["items"] if entry.get("id") == app), None)
          if item is None:
              raise SystemExit(f"application {app!r} is absent from the pulled catalog")

          if not code:
              codes = (item.get("offerCodes") or {}).get(cloud) or []
              codes = [str(value).strip() for value in codes if str(value).strip()]
              if len(codes) != 1:
                  raise SystemExit(
                      f"expected exactly one {cloud} offer code for {app!r}, found {len(codes)}; set offer_code explicitly"
                  )
              code = codes[0]

          Path("/tmp/opencode/offer-run/offer-code.txt").write_text(code + "\n", encoding="utf-8")
          print(f"Resolved {cloud} offer code for {app}: {code}")
          PY
          mk offer resolve-entity --cloud "$CLOUD" --code "$(cat /tmp/opencode/offer-run/offer-code.txt)" > /tmp/opencode/offer-run/entity.json
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          catalog_path = Path("/tmp/opencode/offer-run/catalog.json")
          catalog = json.loads(catalog_path.read_text(encoding="utf-8"))
          item = next(entry for entry in catalog["items"] if entry.get("id") == os.environ["APP"])
          entity = json.loads(Path("/tmp/opencode/offer-run/entity.json").read_text(encoding="utf-8"))
          item["entityId"] = entity["entityId"]
          catalog_path.write_text(json.dumps(catalog, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          print(f"Wrote Catalog EntityId for {os.environ['APP']}: {item['entityId']}")
          PY

      - name: Generate revision-bound plan
        run: |
          mk offer plan \
            --app "$APP" \
            --catalog /tmp/opencode/offer-run/catalog.json \
            --versions /tmp/opencode/offer-run/apps-verson.json \
            --output /tmp/opencode/offer-run/plan.json

      - name: Summarize plan
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import html
          import json
          import os
          from pathlib import Path

          plan = json.loads(Path("/tmp/opencode/offer-run/plan.json").read_text(encoding="utf-8"))
          app = os.environ["APP"]
          app_name = os.environ["APP_NAME"]
          title = app if app_name == app else f"{app_name} (`{app}`)"
          print(f"## Offer plan: {title}")
          print()
          print(f"- Cloud: `{os.environ['CLOUD']}`")
          print(f"- Entity revision: `{plan.get('baseRevision')}`")
          print(f"- Source hash: `{plan.get('sourceHash')}`")
          print(f"- Plan hash: `{plan.get('planHash')}`")
          print(f"- Publish blockers: {', '.join(plan.get('publishBlockers') or []) or 'none'}")

          diff = plan.get("diff") or {}
          print(f"- Pending fields: {len(diff)}")
          print()

          if not diff:
              print("No cloud change is required.")
          else:
              def display(value):
                  if value is None:
                      return "(not set)"
                  if isinstance(value, str):
                      return value
                  return json.dumps(value, ensure_ascii=False, indent=2)

              print("### Pending updates")
              print()
              for field, change in diff.items():
                  before = display(change.get("before"))
                  after = display(change.get("after"))
                  print("<details>")
                  print(f"<summary><code>{html.escape(field)}</code></summary>")
                  print()
                  print("**Before**")
                  print()
                  print(f"<pre>{html.escape(before)}</pre>")
                  print()
                  print("**After**")
                  print()
                  print(f"<pre>{html.escape(after)}</pre>")
                  print()
                  print("</details>")
                  print()

              print("The complete request is stored in the workflow artifact for review.")
          PY

      - name: Upload reviewed plan
        uses: actions/upload-artifact@v7
        with:
          name: offer-plan-${{ inputs.cloud }}-${{ inputs.app }}-${{ github.run_id }}
          path: /tmp/opencode/offer-run/
          if-no-files-found: error

  apply:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: ${{ inputs.cloud }}-marketplace-production
    env:
      APP: ${{ inputs.app }}
      APP_NAME: ${{ inputs.app_name || inputs.app }}
      CLOUD: ${{ inputs.cloud }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install CLI
        run: python -m pip install --disable-pip-version-check '.[aws]'

      - name: Download reviewed plan
        uses: actions/download-artifact@v8
        with:
          name: offer-plan-${{ inputs.cloud }}-${{ inputs.app }}-${{ github.run_id }}
          path: /tmp/opencode/offer-run

      - name: Check cloud support
        run: |
          if [[ "$CLOUD" != "aws" ]]; then
            echo "::error::Only cloud=aws is implemented by the current apply workflow."
            exit 1
          fi

      - name: Check AWS apply role
        env:
          AWS_APPLY_ROLE_ARN: ${{ vars.AWS_APPLY_ROLE_ARN || vars.AWS_ROLE_ARN }}
        run: |
          if [[ -z "$AWS_APPLY_ROLE_ARN" ]]; then
            echo "::error::Configure AWS_APPLY_ROLE_ARN, or AWS_ROLE_ARN, as a variable on the $CLOUD-marketplace-production environment."
            exit 1
          fi
          if [[ ! "$AWS_APPLY_ROLE_ARN" =~ ^arn:aws:iam::[0-9]{12}:role/.+$ ]]; then
            echo "::error::AWS_APPLY_ROLE_ARN must be an IAM role ARN."
            exit 1
          fi

      - name: Configure write AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_APPLY_ROLE_ARN || vars.AWS_ROLE_ARN }}
          aws-region: us-east-1
          role-session-name: MarketplaceOfferApply-${{ github.run_id }}

      - name: Apply reviewed plan
        run: |
          mk offer apply \
            --app "$APP" \
            --catalog /tmp/opencode/offer-run/catalog.json \
            --versions /tmp/opencode/offer-run/apps-verson.json \
            --plan /tmp/opencode/offer-run/plan.json \
            --wait-seconds 600
