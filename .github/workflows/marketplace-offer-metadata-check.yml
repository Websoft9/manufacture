name: Marketplace Metadata Validation
on:
  pull_request:
    paths:
      - 'data/offer/**'
      - 'cli/offer.py'
      - 'ci/validate_offers.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install .
      - run: python3 ci/validate_offers.py
